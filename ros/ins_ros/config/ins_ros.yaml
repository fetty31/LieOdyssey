# Config

ins_ros_node:
  ros__parameters:

    # ============================================================
    # General
    # ============================================================
    frames:
      world: ona2/odom
      body: ona2/base_footprint

    tf:
      publish: false

    # Timing: stamp incoming measurements at receive time instead of trusting
    # msg headers (enable when sensor clocks are not synced with the PC clock)
    timing:
      use_receive_stamp: false

    # ============================================================
    # Filter
    # ============================================================
    filter:
      iterations:
        max: 5
        tolerance: 1.e-5

      # Fixed-frequency estimation loop (callbacks only buffer, timer filters)
      rate: 100.0
      history_window: 5.0
      buffer:
        imu_capacity: 2000
        aiding_capacity: 200

      process_noise:
        gyro: 0.015
        accel: 0.15
        gyro_bias: 1.54e-5
        accel_bias: 3.38e-4

    # Measurement synchronization / latency handling
    sync:
      gps:
        rewind_threshold: 0.05  # delay above this triggers rewind + re-propagation
        max_age: 2.0            # older GPS is dropped as stale
      odom:
        tolerance: 0.05
      wheel_odom:
        tolerance: 0.05
      mag:
        tolerance: 0.05
      baro:
        tolerance: 0.05
      yaw:
        tolerance: 0.10
      future_tolerance: 0.02

    # ============================================================
    # Sensors
    # ============================================================
    sensors:

      imu:
        enabled: true

        topic: /ona2/sensors/imu_front/imu_uncalib

        estimate_orientation: true  # estimate initial orientation (roll+pitch) from IMU measurements (yaw is not observable from IMU)
        estimate_bias: true         # estimate IMU bias (gyro + accel) from IMU measurements
        bias:
          gyro:
            x: 0.0
            y: 0.0
            z: 0.0
          accel:
            x: 0.0
            y: 0.0
            z: 0.0

      gps:
        enabled: true

        topic: /fix

        trust_covariance: true # whether to trust the covariance from the GPS message or not

        covariance: # fixed covariance if trust_covariance is false
          position:
            x: 0.01
            y: 0.01
            z: 10.0

        lever_arm:
          x: 0.4
          y: 0.0
          z: 0.5

      odometry:
        enabled: false

        topic: /fast_limo/state

        trust_covariance: # whether to trust the covariance from the Odometry message or not 
          pose: true      # (if true, the LIO/VIO state estimation should provide a reliable covariance for position and orientation)
          velocity: true  # (if true, the LIO/VIO state estimation should provide a reliable covariance for linear velocity)

        covariance:
          position:
            x: 0.01
            y: 0.01
            z: 0.01
          orientation:
            x: 0.01
            y: 0.01
            z: 0.01
          velocity:
            x: 0.1
            y: 0.1
            z: 0.1

      wheel_odom:
        enabled: false

        topic: /input/wheel_odom

        covariance:
          velocity:
            x: 0.1
            y: 0.1
            z: 0.01

      baro:
        enabled: false

        topic: /input/baro

        covariance:
          altitude: 2.0

      mag:
        enabled: false

        topic: /input/mag

        covariance:
          heading: 0.1