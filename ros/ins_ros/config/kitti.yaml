# Config

ins_ros_node:
  ros__parameters:

    # ============================================================
    # General
    # ============================================================
    frames:
      world: odom
      body: imu_link

    tf:
      publish: true

    # Timing: stamp incoming measurements at receive time instead of trusting
    # msg headers (enable when sensor clocks are not synced with the PC clock)
    timing:
      use_receive_stamp: false   

    # ============================================================
    # Filter
    # ============================================================
    filter:
      iterations:
        max: 5
        tolerance: 1.e-5

      # Fixed-frequency estimation loop (callbacks only buffer, timer filters)
      rate: 100.0
      history_window: 5.0
      buffer:
        imu_capacity: 2000
        measurement_capacity: 200
        processed_capacity: 1000

      process_noise:
        gyro: 6.01e-4
        accel: 1.53e-2
        gyro_bias: 1.54e-5
        accel_bias: 3.38e-4

    # Measurement synchronization / latency handling
    sync:
      gps:
        tolerance: 0.0
      odom:
        tolerance: 0.0
      wheel_odom:
        tolerance: 0.0
      mag:
        tolerance: 0.0
      baro:
        tolerance: 0.0
      yaw:
        tolerance: 0.0
      OOSM_tolerance: 0.0

    # Use trajectory alignment (umemaya) to align Odometry and GPS trajectories 
    trajectory_aligner:
      enabled: true
      min_distance: 35.0

    # ============================================================
    # Sensors
    # ============================================================
    sensors:

      imu:
        enabled: true

        topic: /kitti/oxts/imu

        bias:
          gyro:
            x: 0.01
            y: 0.01
            z: 0.01
          accel:
            x: 0.1
            y: 0.1
            z: 0.1

        init:
          orientation: # estimate initial orientation (roll+pitch) from IMU measurements (yaw is not observable from IMU)
            active: false 

          bias: # estimate IMU bias (gyro + accel) from IMU measurements
            active: false

      gps:
        enabled: true

        topic: /kitti/oxts/gps/fix

        trust_covariance: false # whether to trust the covariance from the GPS message or not

        covariance: # fixed covariance if trust_covariance is false
          position:
            x: 0.01
            y: 0.01
            z: 0.01

        lever_arm: # GPS antena's position relative to body, expressed in body frame
          x: -1.405
          y: 0.32
          z: 0.93

        init:
          orientation: # initial yaw estimation (mandatory for filter initialization in ENU)
            distance_threshold: 1.0

        continuous_orientation: # optional continuous yaw measurement (computed from gps path)
          active: true
          distance_threshold: 1.0

      odometry:
        enabled: true

        topic: /lio_ros/state

        trust_covariance: # whether to trust the covariance from the Odometry message or not 
          pose: true      # (if true, the LIO/VIO state estimation should provide a reliable covariance for position and orientation)
          velocity: true  # (if true, the LIO/VIO state estimation should provide a reliable covariance for linear velocity)

        covariance:
          position:
            x: 0.1
            y: 0.1
            z: 0.1
          orientation:
            x: 0.01
            y: 0.01
            z: 0.01
          velocity:
            x: 10.1
            y: 10.1
            z: 10.1

      wheel_odom:
        enabled: true

        topic: /kitti/oxts/gps/vel

        covariance:
          velocity:
            x: 0.1
            y: 0.1
            z: 0.01