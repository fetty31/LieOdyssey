# Config

ins_ros_node:
  ros__parameters:

    # ============================================================
    # General
    # ============================================================
    frames:
      world: odom
      body: base_link

    tf:
      publish: true

    timing:
      use_receive_stamp: true   # when true, incoming measurements are stamped at receive time instead of trusting msg.header.stamp 
                                # (use it when sensors are not synced with PC's clock)

    # ============================================================
    # Filter
    # ============================================================
    filter:
      iterations:
        max: 5
        tolerance: 1.e-5

      rate: 100.0
      history_window: 5.0
      buffer:
        imu_capacity: 2000
        aiding_capacity: 20000

      process_noise:
        gyro: 6.01e-4
        accel: 1.53e-2
        gyro_bias: 1.54e-5
        accel_bias: 3.38e-4

    sync:
      gps:
        rewind_threshold: 0.05
        max_age: 2.0
      odom:
        tolerance: 0.05
      wheel_odom:
        tolerance: 0.05
      mag:
        tolerance: 0.05
      baro:
        tolerance: 0.05
      yaw:
        tolerance: 5.0
      future_tolerance: 0.02

    # ============================================================
    # Sensors
    # ============================================================
    sensors:

      imu:
        enabled: true

        topic: /kitti/oxts/imu

        estimate_orientation: false  # estimate initial orientation (roll+pitch) from IMU measurements (yaw is not observable from IMU)
        estimate_bias: false         # estimate IMU bias (gyro + accel) from IMU measurements
        bias:
          gyro:
            x: 0.01
            y: 0.01
            z: 0.01
          accel:
            x: 0.1
            y: 0.1
            z: 0.1

      gps:
        enabled: true

        topic: /kitti/oxts/gps/fix

        trust_covariance: false # whether to trust the covariance from the GPS message or not

        covariance: # fixed covariance if trust_covariance is false
          position:
            x: 0.01
            y: 0.01
            z: 0.01

        lever_arm:
          x: -1.405
          y: 0.32
          z: 0.93

      odometry:
        enabled: false

        topic: /lio_ros/state

        trust_covariance: # whether to trust the covariance from the Odometry message or not 
          pose: true      # (if true, the LIO/VIO state estimation should provide a reliable covariance for position and orientation)
          velocity: false  # (if true, the LIO/VIO state estimation should provide a reliable covariance for linear velocity)

        covariance:
          position:
            x: 0.01
            y: 0.01
            z: 0.01
          orientation:
            x: 0.01
            y: 0.01
            z: 0.01
          velocity:
            x: 0.1
            y: 0.1
            z: 0.1

      wheel_odom:
        enabled: false

        topic: /kitti/oxts/gps/vel

        covariance:
          velocity:
            x: 0.1
            y: 0.1
            z: 0.01